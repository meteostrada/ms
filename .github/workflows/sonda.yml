# Sonda: prepara la mappa del mondo e guarda i dati satellitari NOAA. Si lancia a mano.
name: Sonda mondo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q shapely h5py numpy matplotlib pillow
      - name: Mappa del mondo
        run: |
          set +e
          mkdir -p out/ne && cd out
          for n in ne_50m_land ne_50m_lakes ne_50m_admin_0_boundary_lines_land ne_10m_populated_places; do
            curl -sSL -o ne/$n.geojson "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/$n.geojson"
          done
          ls -la ne
          python3 ../repo/tools/mondo.py ne > mondo.log 2>&1; cat mondo.log
      - name: NOAA
        run: |
          set +e
          cd out
          python3 ../repo/tools/sonda/noaa_sonda.py > noaa.log 2>&1; cat noaa.log
          python3 ../repo/tools/sonda/noaa_leggi.py > leggi.log 2>&1; cat leggi.log
      - name: Salva
        if: always()
        run: |
          cd out && rm -rf ne
          git init -q -b sonda-dati
          git config user.name sonda; git config user.email sonda@example.com
          git add -A && git commit -qm "sonda mondo"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sonda-dati
