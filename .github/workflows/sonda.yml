# Sonda: guarda i dati satellitari NOAA. Si lancia a mano.
name: Sonda NOAA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q h5py numpy pillow
      - name: NOAA
        run: |
          set +e
          mkdir out && cd out
          python3 ../repo/tools/sonda/noaa_parti.py > parti.log 2>&1; cat parti.log
      - name: Salva
        if: always()
        run: |
          cd out
          git init -q -b sonda-dati
          git config user.name sonda; git config user.email sonda@example.com
          git add -A && git commit -qm "sonda noaa"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sonda-dati
