# Converte il radar europeo (OPERA) e il satellite (NOAA) in tessere e ripubblica il sito, circa ogni 10 minuti.
# Il timer di GitHub (schedule) non e' affidabile. Il giro successivo lo accoda il job "prossima" qui sotto; se il giro viene annullato
# prima, il flusso "Catena radar" (catena.yml, a fine giro e ogni 20 minuti) lo riaccoda.
name: Pubblica sito e radar
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q h5py numpy pyproj scipy pillow
      - name: Foto già convertite
        uses: actions/cache@v4
        with:
          path: |
            cache/tiles
            cache/noaa
          key: tessere3-${{ github.run_id }}
          restore-keys: tessere3-
      - name: Sito
        run: python3 tools/build_site.py dist
      - name: Radar europeo in tessere
        run: python3 tools/opera_tiles.py cache/tiles 13
      - name: Diagnostica copertura radar
        continue-on-error: true
        run: echo "::notice title=copertura::$(python3 tools/diag.py cache/tiles | cut -c1-2500)"
      - name: Pioggia da satellite (NOAA) in tessere
        continue-on-error: true
        run: python3 tools/noaa_tiles.py cache/noaa 7 2>&1 | tee cache/noaa.log; echo "::notice title=noaa-log::$(tail -n 6 cache/noaa.log | tr '\n' '|' | cut -c1-600)"
      - name: Unisci
        run: |
          mkdir -p dist/tiles dist/noaa
          cp -r cache/tiles/. dist/tiles/
          cp -r cache/noaa/. dist/noaa/ || true
          find dist/tiles dist/noaa \( -name .done -o -name blocchi7.json \) -delete
          du -sh dist
          echo "::notice title=dist::$(du -sh dist | cut -f1), file: $(find dist -type f | wc -l), noaa: $(find dist/noaa -type f 2>/dev/null | wc -l) file $(du -sh dist/noaa 2>/dev/null | cut -f1), tiles: $(du -sh dist/tiles | cut -f1)"
          echo "::notice title=noaa::$(cat dist/noaa/latest.json 2>/dev/null | head -c 400)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  prossima:
    # Accoda il giro successivo dopo 9 minuti, ma solo se non ce ne e' gia' uno attivo (gli altri giri non partono da soli piu' di una volta).
    # "Catena radar" (catena.yml) e' la rete di sicurezza se questo giro viene annullato prima di arrivare qui.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          ME: ${{ github.run_id }}
        run: |
          sleep 540
          n=0
          for st in waiting queued pending in_progress; do
            n=$((n + $(gh api "repos/$R/actions/workflows/pubblica.yml/runs?status=$st&per_page=20" --jq "[.workflow_runs[]|select(.id!=$ME)]|length")))
          done
          if [ "$n" -eq 0 ]; then gh workflow run pubblica.yml --repo "$R" --ref main; echo "giro accodato"; else echo "ci sono gia' $n altri giri"; fi
  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
