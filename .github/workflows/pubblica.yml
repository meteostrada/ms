# Ogni 10 minuti: converte il radar europeo OPERA in tessere e ripubblica il sito.
name: Pubblica sito e radar
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q h5py numpy pyproj scipy pillow
      - name: Foto già convertite
        uses: actions/cache@v4
        with:
          path: |
            cache/tiles
            cache/noaa
          key: tessere-${{ github.run_id }}
          restore-keys: tessere-
      - name: Sito
        run: python3 tools/build_site.py dist
      - name: Radar europeo in tessere
        run: python3 tools/opera_tiles.py cache/tiles 13
      - name: Pioggia da satellite (NOAA) in tessere
        continue-on-error: true
        run: python3 tools/noaa_tiles.py cache/noaa 7
      - name: Unisci
        run: |
          mkdir -p dist/tiles dist/noaa
          cp -r cache/tiles/. dist/tiles/
          cp -r cache/noaa/. dist/noaa/ || true
          find dist/tiles dist/noaa -name .done -delete
          du -sh dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
